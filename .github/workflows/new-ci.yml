name: CI Pipeline

on:
  push:
    branches: [feature/ci-pipeline]

jobs:
  frontend:
    #Github runners are virtual machines that run your workflows. You can specify the type of runner you want to use for your job. In this case, we are using the latest version of Ubuntu as our runner.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup node js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install npm packages
        run: npm install
        working-directory: ./frontend

      - name: Run Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

    

        


